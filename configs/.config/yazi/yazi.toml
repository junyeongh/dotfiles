[mgr]
linemode = "permissions"
ratio = [2, 3, 5]
show_hidden = true

[opener]
pager = [
  { run = "bat --paging=always -- %s", block = true, desc = "Page with bat", for = "unix" },
]
glow = [
  { run = "glow -p %s", block = true, desc = "Open markdown with glow", for = "unix" },
]

[open]
# first matching rule wins, so url rules must come before broader mime rules
prepend_rules = [
  { url = "*.md", use = [
    "glow",
    "edit",
    "reveal",
  ] },
  { mime = "text/*", use = [
    "edit",
    "pager",
    "reveal",
  ] },
]
append_rules = []

[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"'

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"
