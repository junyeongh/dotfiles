onboarding = false

[theme]
name = "nord"

auto_switch = false

[keys]
prefix = "ctrl+space"

# tab
new_tab      = "prefix+t"
close_tab    = "prefix+x"
switch_tab   = "prefix+1..9"
previous_tab = "prefix+shift+tab"
next_tab     = "prefix+tab"
# workspace
new_workspace      = "prefix+shift+t"
close_workspace    = "prefix+shift+x"
switch_workspace   = "prefix+shift+1..9"
previous_workspace = "prefix+shift+p"
next_workspace     = "prefix+shift+n"
# agent
focus_agent        = "prefix+alt+1..9"

[[keys.command]]
key     = "prefix+alt+g"
type    = "popup"
command = "lazygit"
width   = "80%"
height  = "80%"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"

[ui.toast]
delivery = "herdr"

[experimental]
pane_history = false
