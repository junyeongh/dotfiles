theme = "nord"

[editor]
color-modes = true
cursorline = true
bufferline = "multiple"
true-color = true
# undercurl = true

[editor.cursor-shape]
insert = "bar"
select = "underline"

[editor.statusline]
left = ["mode", "spinner", "read-only-indicator", "version-control"]
center = ["file-name", "file-modification-indicator"]
right = [
  "diagnostics",
  "selections",
  "position",
  "file-encoding",
  "file-line-ending",
  "file-type",
]
mode.normal = "🔵️ NORMAL"
mode.insert = "🟢️ INSERT"
mode.select = "🟠️ SELECT"

[editor.whitespace]
render.space = "all"
render.tab = "all"

[editor.indent-guides]
render = true

[editor.auto-save]
focus-lost = true
after-delay.enable = true

[editor.file-picker]
hidden = false # show dotfiles
ignore = false # ignore .ignore files
# git-ignore = false  # ignore .gitignore
# git-global = false  # ignore global gitignore
# git-exclude = false # ignore .git/info/exclude

[keys.normal]
# maps ctrl-s to the typable command :w which is an alias for :write (save file)
C-s = ":w"
# maps ctrl-o to opening of the helix config file
C-o = ":config-open"
# move line down
A-j = ["extend_to_line_bounds", "delete_selection", "paste_after"]
# move line up
A-k = [
  "extend_to_line_bounds",
  "delete_selection",
  "move_line_up",
  "paste_before",
]
"$" = "goto_line_end"
0 = "goto_line_start"

G = "goto_file_end"
# https://gist.github.com/Schr3da/4767e436f2cc47c5d23fc05745fd6d03
C-e = [
  ':sh rm -f /tmp/unique-file',
  ':insert-output yazi %{buffer_name} --chooser-file=/tmp/unique-file',
  ':insert-output echo "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/unique-file}',
  ':redraw',
]
# https://github.com/helix-editor/helix/discussions/12045
C-g = [
  ":write-all",
  ":new",
  ":insert-output lazygit",
  ":buffer-close!",
  ":redraw",
  ":reload-all",
]

[keys.normal.space]
# Buffer related key remaps
b = { a = ":buffer-close-all", b = "buffer_picker", o = ":buffer-close-others", x = ":buffer-close ", n = ":buffer-next", p = ":buffer-previous" }
q = ":quit"

# https://github.com/helix-editor/helix/pull/3958
# [keys.normal.space.b]
