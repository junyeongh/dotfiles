[theme]
builtin = "Nord"
mode = "light"

[control_center]
sidebar = "full"
sidebar_section = "full"

[control_center.calendar]
show_events_card = false

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[dock]
enabled = true
icon_size = 36
radius = 8
reserve_space = false
show_dots = true
smart_auto_hide = true
font_family = "Pretendard"

[shell]
polkit_agent = true

[bar.default]
capsule = true
capsule_fill = "shadow"
capsule_radius = 10
capsule_thickness = 0.75
concave_edge_corners = false
font_family = "D2CodingLigature Nerd Font"
margin_ends = 4
padding = 12
radius = 8
radius_top_left = 0
radius_top_right = 0

start = ["workspaces", "active_window"]
center = ["clock", "notes"]
end = ["group:g1", "group:g2", "group:g3", "group:g4"]

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
enabled = true
fill = "shadow"
id = "g1"
members = ["tray", "notifications", "clipboard", "lock_keys"]
opacity = 1.0
padding = 6.0

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
enabled = true
fill = "shadow"
id = "g2"
members = ["bluetooth", "network", "bar"]
opacity = 1.0
padding = 6.0

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
enabled = true
fill = "shadow"
id = "g3"
members = ["volume", "brightness", "battery"]
opacity = 1.0
padding = 6.0

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
enabled = true
fill = "shadow"
id = "g4"
members = ["control-center", "session"]
opacity = 1.0
padding = 6.0
radius = 10.0

[widget.battery]
hide_when_full = false
show_label = false

[widget.brightness]
capsule = true
show_label = false

[widget.network]
show_label = false

[widget.tray]
drawer = true
drawer_columns = 4
pinned = ["kime"]

[widget.volume]
show_label = false

[widget.clock]
tooltip_format = "{:%Y-%m-%d}"
format = "{:%-I:%M %p}"

[widget.lock_keys]
display = "full"
hide_when_off = true
show_scroll_lock = true

[widget.bar]
type = "rylos/tailnet:bar"

[widget.notes]
type = "noctalia/notes:notes"

[plugins]
enabled = ["rylos/tailnet", "noctalia/notes"]

[plugin_settings."noctalia/umbriel-companion"]
panel_placement = "floating"
panel_position = "center"
